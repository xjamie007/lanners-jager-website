# Supabase-Konfiguration (CLI). Projekt in einer EU-Region anlegen (D10.2).
# Alle Functions prüfen selbst: öffentlich (stock, Formulare, Webhook, Status mit
# HMAC) oder mit Geheimnis (Cron, Build). Ein Formular-POST oder ein Webhook kann
# keinen Supabase-JWT mitschicken, deshalb verify_jwt = false.
project_id = "lanners-jager"

[functions.stock]
verify_jwt = false
